<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Ammeter in series and voltmeter across">
  <rect width="640" height="400" fill="#0e1118"/>
  <text x="100" y="36" fill="#e8edf5" font-size="18" font-family="Segoe UI, sans-serif">Ammeter sits in the path. Voltmeter sits across it.</text>
  <rect x="20" y="56" width="290" height="300" rx="10" fill="#161b26" stroke="#2a3344"/>
  <text x="90" y="88" fill="#34d399" font-size="16" font-family="Segoe UI, sans-serif">AMMETER (A)</text>
  <rect x="70" y="120" width="190" height="140" fill="none" stroke="#2ec4b6" stroke-width="3"/>
  <rect x="130" y="172" width="70" height="40" rx="6" fill="#111827" stroke="#34d399"/>
  <text x="156" y="198" fill="#34d399" font-size="18" font-family="Cascadia Mono, monospace">A</text>
  <text x="48" y="300" fill="#93a0b5" font-size="13" font-family="Segoe UI, sans-serif">in series - measures I</text>
  <text x="48" y="324" fill="#93a0b5" font-size="13" font-family="Segoe UI, sans-serif">through the loop</text>
  <rect x="330" y="56" width="290" height="300" rx="10" fill="#161b26" stroke="#2a3344"/>
  <text x="390" y="88" fill="#7eb6ff" font-size="16" font-family="Segoe UI, sans-serif">VOLTMETER (V)</text>
  <rect x="380" y="130" width="190" height="120" fill="none" stroke="#2ec4b6" stroke-width="3"/>
  <path d="M475 130 V90 H560 V210 H475" fill="none" stroke="#7eb6ff" stroke-width="2" stroke-dasharray="5 4"/>
  <rect x="530" y="140" width="50" height="36" rx="5" fill="#111827" stroke="#7eb6ff"/>
  <text x="546" y="164" fill="#7eb6ff" font-size="16" font-family="Cascadia Mono, monospace">V</text>
  <text x="360" y="300" fill="#93a0b5" font-size="13" font-family="Segoe UI, sans-serif">across two points - V</text>
  <text x="360" y="324" fill="#93a0b5" font-size="13" font-family="Segoe UI, sans-serif">not through the wire</text>
</svg>
