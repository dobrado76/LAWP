<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Voltage as a height difference">
  <rect width="640" height="400" fill="#0e1118"/>
  <text x="140" y="40" fill="#e8edf5" font-size="18" font-family="Segoe UI, sans-serif">Voltage is a difference - a push, not stuff in the wire</text>
  <rect x="80" y="80" width="200" height="220" rx="8" fill="#1a2030" stroke="#e6b84d" stroke-width="2"/>
  <text x="118" y="130" fill="#e6b84d" font-size="28" font-family="Segoe UI, sans-serif">HIGH</text>
  <text x="124" y="168" fill="#93a0b5" font-size="16" font-family="Segoe UI, sans-serif">+ side</text>
  <rect x="360" y="80" width="200" height="220" rx="8" fill="#111827" stroke="#7eb6ff" stroke-width="2"/>
  <text x="408" y="130" fill="#7eb6ff" font-size="28" font-family="Segoe UI, sans-serif">LOW</text>
  <text x="404" y="168" fill="#93a0b5" font-size="16" font-family="Segoe UI, sans-serif">- side</text>
  <path d="M280 190 H360" stroke="#2ec4b6" stroke-width="4" marker-end="url(#ah)"/>
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#2ec4b6"/>
    </marker>
  </defs>
  <text x="292" y="180" fill="#2ec4b6" font-size="14" font-family="Segoe UI, sans-serif">push</text>
  <text x="80" y="340" fill="#e8edf5" font-size="16" font-family="Segoe UI, sans-serif">You measure voltage across two points, not through a point.</text>
  <text x="80" y="368" fill="#93a0b5" font-size="15" font-family="Segoe UI, sans-serif">A 1.5 V cell is a 1.5 volt difference between its ends.</text>
</svg>
