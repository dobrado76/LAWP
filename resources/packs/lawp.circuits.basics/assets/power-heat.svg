<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Power as brightness and heat">
  <rect width="640" height="400" fill="#0e1118"/>
  <text x="160" y="40" fill="#e8edf5" font-size="18" font-family="Segoe UI, sans-serif">Power is how fast energy is spent: P = V - I</text>
  <circle cx="180" cy="180" r="50" fill="#fbbf24" stroke="#f59e0b" stroke-width="3"/>
  <circle cx="180" cy="180" r="22" fill="#fde68a"/>
  <text x="148" y="260" fill="#e6b84d" font-size="16" font-family="Segoe UI, sans-serif">light</text>
  <path d="M360 130 q20 20 0 50 q20 20 0 50" fill="none" stroke="#e07a5f" stroke-width="4"/>
  <path d="M400 120 q20 24 0 56 q20 24 0 56" fill="none" stroke="#e07a5f" stroke-width="4"/>
  <path d="M440 130 q20 20 0 50 q20 20 0 50" fill="none" stroke="#e07a5f" stroke-width="4"/>
  <text x="392" y="260" fill="#e07a5f" font-size="16" font-family="Segoe UI, sans-serif">heat</text>
  <text x="70" y="320" fill="#e8edf5" font-size="16" font-family="Segoe UI, sans-serif">A bright lamp and a hot wire can spend the same energy in different ways.</text>
  <text x="70" y="350" fill="#93a0b5" font-size="15" font-family="Segoe UI, sans-serif">More current at the same voltage means more power. That is why a short gets hot fast.</text>
</svg>
