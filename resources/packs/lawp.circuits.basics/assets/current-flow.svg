<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Current the same all around a series loop">
  <rect width="640" height="400" fill="#0e1118"/>
  <rect x="100" y="80" width="440" height="220" rx="8" fill="none" stroke="#2ec4b6" stroke-width="4"/>
  <rect x="268" y="58" width="104" height="40" rx="5" fill="#1f2937" stroke="#9ca3af"/>
  <text x="286" y="84" fill="#e8edf5" font-size="15" font-family="Segoe UI, sans-serif">Battery</text>
  <circle cx="320" cy="300" r="24" fill="#fbbf24" stroke="#f59e0b"/>
  <polygon points="100,154 92,174 108,174" fill="#2ec4b6"/>
  <text x="114" y="168" fill="#2ec4b6" font-size="15" font-family="Segoe UI, sans-serif" font-style="italic">I = 1</text>
  <polygon points="540,226 548,206 532,206" fill="#2ec4b6"/>
  <text x="486" y="200" fill="#2ec4b6" font-size="15" font-family="Segoe UI, sans-serif" font-style="italic">I = 1</text>
  <polygon points="304,300 324,292 324,308" fill="#2ec4b6"/>
  <text x="292" y="360" fill="#2ec4b6" font-size="15" font-family="Segoe UI, sans-serif" font-style="italic">I = 1</text>
  <text x="120" y="40" fill="#e8edf5" font-size="18" font-family="Segoe UI, sans-serif">Current is a flow — the same at every point on one path</text>
  <text x="120" y="390" fill="#93a0b5" font-size="14" font-family="Segoe UI, sans-serif">It is not used up in the lamp. The lamp uses energy. The charge comes home.</text>
