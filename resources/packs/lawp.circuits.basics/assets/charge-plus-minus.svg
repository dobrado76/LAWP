<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Positive and negative charge">
  <rect width="640" height="400" fill="#0e1118"/>
  <text x="160" y="48" fill="#e8edf5" font-size="20" font-family="Segoe UI, sans-serif">Charge is a property, not a juice</text>
  <circle cx="180" cy="180" r="70" fill="#13241f" stroke="#2ec4b6" stroke-width="3"/>
  <text x="156" y="174" fill="#e6b84d" font-size="48" font-family="Segoe UI, sans-serif">+</text>
  <text x="132" y="210" fill="#93a0b5" font-size="16" font-family="Segoe UI, sans-serif">positive</text>
  <circle cx="460" cy="180" r="70" fill="#1a2030" stroke="#7eb6ff" stroke-width="3"/>
  <text x="444" y="174" fill="#7eb6ff" font-size="48" font-family="Segoe UI, sans-serif">-</text>
  <text x="412" y="210" fill="#93a0b5" font-size="16" font-family="Segoe UI, sans-serif">negative</text>
  <path d="M260 180 H390" stroke="#93a0b5" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="88" y="300" fill="#e8edf5" font-size="16" font-family="Segoe UI, sans-serif">Opposite charges pull. Same charges push apart.</text>
  <text x="88" y="332" fill="#93a0b5" font-size="15" font-family="Segoe UI, sans-serif">A battery holds them apart so they want a path back together.</text>
  <text x="88" y="364" fill="#93a0b5" font-size="15" font-family="Segoe UI, sans-serif">You do not need two different metals - you need a difference.</text>
</svg>
