<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Ohm's law V equals I times R">
  <rect width="640" height="400" fill="#0e1118"/>
  <text x="200" y="40" fill="#e8edf5" font-size="20" font-family="Segoe UI, sans-serif">Ohm-s law is a relation: V = I - R</text>
  <polygon points="320,80 180,300 460,300" fill="#161b26" stroke="#2ec4b6" stroke-width="3"/>
  <line x1="180" y1="190" x2="460" y2="190" stroke="#2a3344" stroke-width="2"/>
  <text x="300" y="150" fill="#e6b84d" font-size="36" font-family="Segoe UI, sans-serif">V</text>
  <text x="230" y="270" fill="#2ec4b6" font-size="32" font-family="Segoe UI, sans-serif">I</text>
  <text x="370" y="270" fill="#7eb6ff" font-size="32" font-family="Segoe UI, sans-serif">R</text>
  <text x="80" y="350" fill="#e8edf5" font-size="16" font-family="Segoe UI, sans-serif">Cover V: I - R. Cover I: V - R. Cover R: V - I.</text>
  <text x="80" y="378" fill="#93a0b5" font-size="15" font-family="Segoe UI, sans-serif">Same loop: raise V or lower R and current rises. The lamp is not a separate magic.</text>
</svg>
