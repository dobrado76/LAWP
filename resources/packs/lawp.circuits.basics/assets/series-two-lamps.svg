<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Two lamps in series">
  <rect width="640" height="400" fill="#0e1118"/>
  <text x="170" y="36" fill="#e8edf5" font-size="18" font-family="Segoe UI, sans-serif">Series: one path. Current the same. Voltages share.</text>
  <rect x="90" y="80" width="460" height="230" rx="8" fill="none" stroke="#2ec4b6" stroke-width="4"/>
  <rect x="268" y="58" width="104" height="40" rx="5" fill="#1f2937" stroke="#9ca3af"/>
  <text x="286" y="84" fill="#e8edf5" font-size="15" font-family="Segoe UI, sans-serif">Battery</text>
  <circle cx="200" cy="310" r="22" fill="#e6b84d" stroke="#f59e0b"/>
  <circle cx="440" cy="310" r="22" fill="#e6b84d" stroke="#f59e0b"/>
  <text x="176" y="360" fill="#93a0b5" font-size="13" font-family="Segoe UI, sans-serif">Lamp A</text>
  <text x="416" y="360" fill="#93a0b5" font-size="13" font-family="Segoe UI, sans-serif">Lamp B</text>
  <polygon points="90,180 82,200 98,200" fill="#2ec4b6"/>
  <text x="104" y="196" fill="#2ec4b6" font-size="14" font-family="Segoe UI, sans-serif" font-style="italic">I</text>
  <polygon points="550,210 558,190 542,190" fill="#2ec4b6"/>
  <text x="560" y="204" fill="#2ec4b6" font-size="14" font-family="Segoe UI, sans-serif" font-style="italic">I</text>
  <text x="70" y="390" fill="#93a0b5" font-size="14" font-family="Segoe UI, sans-serif">One gap anywhere and both go dark. Each lamp gets only part of the push.</text>
</svg>
