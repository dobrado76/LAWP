<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Resistance as a squeeze on the path">
  <rect width="640" height="400" fill="#0e1118"/>
  <text x="150" y="40" fill="#e8edf5" font-size="18" font-family="Segoe UI, sans-serif">Resistance squeezes the path. More ohms, less current.</text>
  <path d="M60 140 H200 C230 140 230 100 280 100 H360 C410 100 410 140 440 140 H580" fill="none" stroke="#2ec4b6" stroke-width="18" stroke-linecap="round"/>
  <text x="250" y="88" fill="#e6b84d" font-size="15" font-family="Segoe UI, sans-serif">high R - narrow</text>
  <path d="M60 280 H580" fill="none" stroke="#2ec4b6" stroke-width="28" stroke-linecap="round"/>
  <text x="250" y="250" fill="#7dce82" font-size="15" font-family="Segoe UI, sans-serif">low R - wide</text>
  <text x="70" y="350" fill="#e8edf5" font-size="16" font-family="Segoe UI, sans-serif">Zero ohms is not a super lamp. It is a short: huge current, heat, danger.</text>
</svg>
