# Check + ship the NSIS installer only for version tags (GitHub Release).
# Branch / PR pushes do not run CI.
# Do not use actions/upload-artifact — attach files to the Release only.
name: Build Windows

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: build-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck and test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

  release:
    name: Windows installer → GitHub Release
    needs: check
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build NSIS installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:nobump

      - name: Attach installer to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/LAWP-*.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
